name: CI (npm-wrapper)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: ci-npm-wrapper-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: npm-wrapper
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Assert credentialless
        run: |
          if [ -n "${NPM_TOKEN:-}" ]; then
            echo "FAIL: NPM_TOKEN is set; wrapper CI is credentialless" >&2
            exit 1
          fi
      - name: Install (no lifecycle scripts)
        run: npm ci --ignore-scripts
      - name: Sync + test
        run: npm test
      - name: Pack dry-run
        run: npm pack --dry-run --ignore-scripts --json > pack.json
      - name: Guard bin + size
        run: |
          node -e "const b=require('./package.json').bin; if (b.dory) process.exit(1)"
          node -e "const raw=require('./pack.json'); const p=Array.isArray(raw)?raw[0]:raw[Object.keys(raw)[0]]; if(p.unpackedSize>1048576) process.exit(1)"
